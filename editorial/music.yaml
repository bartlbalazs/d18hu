  - type: music
    year: 1968
    slug: 1968-amikor-en-meg-kissrac-voltam
    anchor_id: zene-1968-amikor-en-meg-kissrac-voltam
    title: Amikor én még kissrác voltam
    credit: Illés
    composer: Szörényi Levente
    lyricist: Bródy János
    description: 'Hatvanhét évvel az Őszi rózsa után már elektromos gitár szól, és egy új nemzedék beszél saját
      magáról. Az Illés dala gyerekkori utcákat és bérházudvarokat idéz fel, miközben az 1968-as Táncdalfesztivál
      nagydíját is elnyerte. Különösen jó végpont: mire a timeline elér 1968-hoz, Budapest már nem pusztán helyszíne
      a slágernek, hanem maga is az emlékezés tárgya.'
