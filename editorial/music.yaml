      url: https://gramofononline.hu/352554452/oszi_rozsa_feher_oszi_rozsa
      purpose: korai gramofonfelvétel és szerzőségi adatok
    recording_year: 1914
    recording_label: Columbia
    recording_catalog_number: E 972
