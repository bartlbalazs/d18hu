  - type: music
    year: 1959
    slug: 1959-pancsolo-kislany
    anchor_id: zene-1959-pancsolo-kislany
    title: Pancsoló kislány
    credit: Kovács Eszti
    composer: Berki Géza
    lyricist: Brandt István
    description: 'A Pancsoló kislány világa látványosan hétköznapibb annál, ahonnan ez a zenei történet elindult:
      strand, nyár, gyerekzsivaj és Bambi kerül a sláger középpontjába. Közben maga a zenehallgatás is megváltozott:
      Kovács Eszti 1959-ben énekelte fel a számot, amely az első magyar mikrobarázdás kislemezen jelent meg. A sláger
      immár könnyen hazavihető tárgy lett.'
    playback_source: youtube
    youtube_id: sFcdFRV1OdE
    youtube_url: https://www.youtube.com/watch?v=sFcdFRV1OdE
