  - type: music
    year: 1942
    slug: 1942-valahol-oroszorszagban
    anchor_id: zene-1942-valahol-oroszorszagban
    title: Valahol Oroszországban
    credit: Karády Katalin
    composer: De Fries Károly
    lyricist: Kovách Kálmán
    work: Valahol Oroszországban
    description: A háború itt már nem háttér, hanem maga a dal témája. Az 1942-es rövidfilmben egy frontra visszatérő
      hadnagy arra kéri Karádyt, hogy a rádión keresztül énekeljen a katonáknak; a fronton aztán rádió köré gyűlve
      hallgatják. A tömegmédia itt láthatatlan hidat épít a budapesti otthon és a több ezer kilométerre lévő háború
      között.
