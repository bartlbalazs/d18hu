  - type: music
    year: 1904
    slug: 1904-egy-rozsaszal-szebben-beszel
    anchor_id: zene-1904-egy-rozsaszal-szebben-beszel
    title: Egy rózsaszál szebben beszél
    credit: Kacsóh Pongrác · János vitéz
    composer: Kacsóh Pongrác
    lyricist: Heltai Jenő
    work: János vitéz
    description: '1904 őszén a János vitéz budapesti bemutatója egy újfajta nagyvárosi tömegélmény része lett. Dalai
      nem maradtak a Király Színház falai között: kottán, zongorán és otthoni éneklésben is tovább éltek. Az Egy
      rózsaszál szebben beszél már azt a korszakot jelzi, amikor egy színpadi siker rövid idő alatt közös városi
      dallammá válhatott.'
    playback_source: youtube
    youtube_id: Wh7fmbrJA7E
    youtube_url: https://www.youtube.com/watch?v=Wh7fmbrJA7E
    youtube_embed_url: https://www.youtube-nocookie.com/embed/Wh7fmbrJA7E
    recording_artist: Palló Imre, Kiss Ferenc
    recording_relation: archival_film_recording
    recording_note: Archív részlet Gaál Béla János vitéz-filmjéből, Palló Imre és Kiss Ferenc közreműködésével.
      A timeline éve az 1904-es Király Színház-i ősbemutatót jelöli.
    sources:
    - title: Egy rózsaszál szebben beszél – a János vitéz születésének története
      url: https://pnsz.jegy.hu/program/egy-rozsaszal-szebben-beszel-168262
      purpose: 1904. november 18-i Király Színház-bemutató
    recording_year: 1938
    recording_source: János vitéz (1938), hangosfilm
    media:
