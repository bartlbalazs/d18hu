  - type: music
    year: 1935
    slug: 1935-szomoru-vasarnap
    anchor_id: zene-1935-szomoru-vasarnap
    title: Szomorú vasárnap
    credit: Kalmár Pál · Seress Rezső
    composer: Seress Rezső
    lyricist: Jávor László
    description: A Szomorú vasárnap egy budapesti dalból néhány év alatt nemzetközi jelenség lett. Kalmár Pál 1935-ös
      magyar felvétele után hamar külföldi változatok is készültek, majd a dal világkarriert futott be. Addig a
      pesti közönség sokszor külföldről érkező divatokat vett át; ezúttal egy budapesti kávéházi dal indult el az
      ellenkező irányba.
