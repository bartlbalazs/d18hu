  - type: music
    year: 1926
    slug: 1926-van-a-bajza-utca-sarkan
    anchor_id: zene-1926-van-a-bajza-utca-sarkan
    title: Van a Bajza utca sarkán
    credit: Zerkovitz Béla · Csókos asszony
    composer: Zerkovitz Béla
    lyricist: Szilágyi László
    work: Csókos asszony
    description: 'A húszas évekre Budapest már saját magáról énekel. A Csókos asszony szereplői és helyszínei nem
      távoli mesevilágban mozognak, hanem felismerhető pesti utcákon és városi terekben; a korabeli sajtó a Van
      a Bajza utca sarkán című számot már 1926-ban az operett egyik slágerének nevezte. A Dembinszky utca történetében
      ezért különösen jó állomás: a könnyűzene egyszer csak földrajzilag is egészen közel ér.'
    playback_source: youtube
    youtube_id: CKUargsxlaw
    youtube_url: https://www.youtube.com/watch?v=CKUargsxlaw
    youtube_embed_url: https://www.youtube-nocookie.com/embed/CKUargsxlaw
    recording_artist: Udvardy Tibor és Petress Zsuzsa
    recording_relation: later_recording
    recording_note: Későbbi operettfelvétel. A timeline éve a Csókos asszony 1926-os sikeréhez kapcsolódik.
