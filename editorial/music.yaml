  - type: music
    year: 1916
    slug: 1916-hajmasi-peter-hajmasi-pal
    anchor_id: zene-1916-hajmasi-peter-hajmasi-pal
    title: Hajmási Péter, Hajmási Pál
    credit: Kálmán Imre · Csárdáskirálynő
    composer: Kálmán Imre
    lyricist: Gábor Andor
    work: Csárdáskirálynő
    description: '1916-ban Budapest már két éve háborúban élt, a színházakban mégis tovább szólt az operett. A Csárdáskirálynő
      pezsgővel, cigányzenével és könnyed refrénekkel kínált néhány órányi menekülést abból, ami odakint történt.
      A Hajmási Péter, Hajmási Pál ennek a különös kettősségnek lett egyik legtartósabb dallama: háborús Budapest
      zenéje, amelyben szinte semmi sem szól a háborúról.'
    playback_source: youtube
    youtube_id: xahdLvks9kk
    youtube_url: https://www.youtube.com/watch?v=xahdLvks9kk
    youtube_embed_url: https://www.youtube-nocookie.com/embed/xahdLvks9kk
    recording_artist: Honthy Hanna, Feleki Kamill és Homm Pál
    recording_relation: later_recording
    recording_note: 'Későbbi klasszikus operettfelvétel. A timeline éve a budapesti bemutató éve: 1916.'
    sources:
    - title: Nemzeti Archívum – Csárdáskirálynő, az operettek operettje
      url: https://nemzetiarchivum.hu/stories/Csardaskiralyno
      purpose: 1916. november 3-i budapesti bemutató és történeti háttér
    media:
