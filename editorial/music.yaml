  - type: music
    year: 1901
    slug: 1901-oszi-rozsa-feher-oszi-rozsa
    anchor_id: zene-1901-oszi-rozsa-feher-oszi-rozsa
    title: Őszi rózsa, fehér őszi rózsa
    credit: Fráter Lóránd
    composer: Fráter Lóránd
    lyricist: Zalár József
    description: 'A századfordulón egy népszerű dal még elsősorban kottán, vendéglőkben és élő muzsikán keresztül
      járta be az országot. Az Őszi rózsa, fehér őszi rózsa 1901-ben már nyomtatásban is megjelent. Különlegessége,
      hogy 1914-ből maga a szerző, Fráter Lóránd előadásában is fennmaradt gramofonfelvétel: így nemcsak a dallamot,
      hanem a korszak előadásmódjának egy darabját is hallhatjuk.'
    playback_source: youtube
    youtube_id: k9DhNQVzFnI
    youtube_url: https://www.youtube.com/watch?v=k9DhNQVzFnI
    youtube_embed_url: https://www.youtube-nocookie.com/embed/k9DhNQVzFnI
    recording_artist: Fráter Lóránd
    recording_relation: author_period_recording
    recording_note: 1914-es gramofonfelvétel maga Fráter Lóránd előadásában, Columbia E 972. A timeline éve a dal
      1901-es megjelenését jelöli; a meghallgatható felvétel 1914-es.
    sources:
    - title: Magyar Könyvkereskedők Évkönyve, 1901 – zeneműjegyzék
      url: https://epa.oszk.hu/02500/02548/00013/pdf/EPA02548_magyar_konyvkereskedok_evkonyve_1901_281-323.pdf
      purpose: 1901-es megjelenés
